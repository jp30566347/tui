[package]
name = "macro-tui"
version = "0.5.0"
edition = "2021"
description = "Macro market overview and news in your terminal"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["markets", "finance", "tui", "terminal", "stocks"]
categories = ["command-line-utilities"]
exclude = [".github/"]

[[bin]]
name = "macro-tui"
path = "src/main.rs"
doc = false

[dependencies]
tui-common = { path = "../crates/tui-common" }
ratatui.workspace = true
crossterm.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
color-eyre.workspace = true
clap.workspace = true
chrono.workspace = true
toml.workspace = true
dirs.workspace = true
quick-xml = "0.42"
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
